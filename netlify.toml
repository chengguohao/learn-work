# Netlify 部署配置 - 成国浩的工作台
[build]
  publish = "."

# PWA / SPA：所有 404 都返回 index.html（避免刷新白屏）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 静态资源缓存（让 PWA 更快）
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
